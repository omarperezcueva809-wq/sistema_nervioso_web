function pts(P,C,size,op=1){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));g.setAttribute('color',new THREE.Float32BufferAttribute(C,3));return new THREE.Points(g,new THREE.PointsMaterial({size,map:glT,vertexColors:true,transparent:true,opacity:op,depthWrite:false,blending:ADD}))}
function glowSp(c,s,o=1){const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:glT,color:c,blending:ADD,transparent:true,depthWrite:false,opacity:o}));sp.scale.set(s,s,1);return sp}
function ellip(n,rx,ry,rz,ox,oy,oz,w,sx,cf){const P=[],C=[],c=new THREE.Color();for(let i=0;i<n;i++){const y=1-2*(i+.5)/n,r=Math.sqrt(1-y*y),t=i*2.39996,x=Math.cos(t)*r,z=Math.sin(t)*r,f=1+w(x,y,z);P.push(ox+x*rx*f+Math.sign(x)*sx,oy+y*ry*f,oz+z*rz*f);cf(c,x,y,z);c.multiplyScalar(.55+.6*Math.random());C.push(c.r,c.g,c.b)}return[P,C]}
const tube=(c,r,col,op,seg=60)=>new THREE.Mesh(new THREE.TubeGeometry(c,seg,r,6,false),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:op,blending:ADD,depthWrite:false}));
const CR=a=>new THREE.CatmullRomCurve3(a.map(p=>V(p[0],p[1],p[2])));
const body=new THREE.Group(),conn=new THREE.Group();scene.add(body);body.add(conn);

// cerebro
const [bP,bC]=ellip(Math.round(3000*K),22,17,26,0,3,0,(x,y,z)=>.06*Math.sin(x*9+z*7)*Math.sin(y*8+x*3)+.03*Math.sin(z*14),1.8,(c,x,y,z)=>c.set(z>.35?0xff6b4a:z<-.5?0xff3d9a:y<-.25?0xffd98a:0xffb12b));
const brain=pts(bP,bC,2.3,.95);body.add(brain);
const BL=[],BC=[];for(let k=0;k<4000&&BL.length<440*K*6;k++){const a=(Math.random()*bP.length/3|0)*3,b=(Math.random()*bP.length/3|0)*3,dx=bP[a]-bP[b],dy=bP[a+1]-bP[b+1],dz=bP[a+2]-bP[b+2],q=dx*dx+dy*dy+dz*dz;if(q>9&&q<110){BL.push(bP[a],bP[a+1],bP[a+2],bP[b],bP[b+1],bP[b+2]);BC.push(a,b)}}
const bg=new THREE.BufferGeometry();bg.setAttribute('position',new THREE.Float32BufferAttribute(BL,3));conn.add(new THREE.LineSegments(bg,new THREE.LineBasicMaterial({color:0xff9a6b,transparent:true,opacity:.13,blending:ADD,depthWrite:false})));
// cerebelo y tronco
const [cP,cC]=ellip(Math.round(750*K),12,7,9,0,-15,-19,(x,y)=>.08*Math.sin(y*38),0,c=>c.set(Math.random()<.5?0x2de2c4:0x1fb8a0));body.add(pts(cP,cC,2.1,.95));
{const P=[],C=[],c=new THREE.Color(0xffd98a);for(let i=0;i<450*K;i++){const y=-12-rnd(0,20),a=rnd(0,6.28),r=3.4+.8*Math.sin(y*.4);P.push(Math.cos(a)*r,y,-8+Math.sin(a)*r+(-y-12)*.1);C.push(c.r*rnd(.5,1),c.g*rnd(.5,1),c.b*rnd(.5,1))}body.add(pts(P,C,2,.95))}
// médula
const spineC=CR([[0,-30,-8],[0,-60,-9],[0,-100,-11],[0,-140,-10],[0,-175,-8]]);
body.add(tube(spineC,2.6,0xff9a3d,.25,80));
{const P=[],C=[],c=new THREE.Color();for(let i=0;i<800*K;i++){const p=spineC.getPoint(Math.random()),a=rnd(0,6.28),r=rnd(0,3);P.push(p.x+Math.cos(a)*r,p.y,p.z+Math.sin(a)*r);c.set(Math.random()<.5?0xff7a3d:0xffb12b);C.push(c.r,c.g,c.b)}body.add(pts(P,C,1.8,.9))}
for(let i=0;i<14;i++){const t=(i+.5)/14,p=spineC.getPoint(t),m=new THREE.Mesh(new THREE.TorusGeometry(5.4,.55,6,22),new THREE.MeshBasicMaterial({color:0xe8d8c0,transparent:true,opacity:.3,blending:ADD,depthWrite:false}));m.position.copy(p);m.rotation.x=Math.PI/2;body.add(m)}
// nervios periféricos
const mir=a=>a.map(p=>[-p[0],p[1],p[2]]),arm=[[0,-62,-9],[-26,-66,-6],[-58,-94,-2],[-90,-134,4],[-102,-170,8]],leg=[[0,-175,-8],[-16,-205,-6],[-26,-250,-2],[-30,-300,2],[-30,-345,8]];
const sp0=[[0,-14,-8],[0,-34,-8]],spL=[[0,-60,-9],[0,-110,-11],[0,-150,-10]];
const NV=[],paths=[];
function addNerve(a,main,pulse){const c=CR(a);const t=tube(c,.45,0xffc46b,.6,50);conn.add(t);NV.push(c);if(main){const pk=new THREE.Mesh(new THREE.TubeGeometry(c,24,6,5,false),new THREE.MeshBasicMaterial({visible:false}));pk.userData.id='nerves';pickers.push(pk);body.add(pk);const e=c.getPoint(1),g=glowSp(0xffc46b,9,.8);g.position.copy(e);body.add(g)}if(pulse)paths.push(c)}
const pickers=[];
[-62,-84,-106,-128,-150].forEach(y=>[1,-1].forEach(s=>addNerve([[0,y,-9],[s*14,y-3,-4],[s*30,y-10,6],[s*40,y-24,16]],false,true)));
[arm,mir(arm)].forEach(a=>{addNerve(a,true,false);paths.push(CR([...sp0,...[[0,-62,-9]],...a.slice(1)]))});
[leg,mir(leg)].forEach(a=>{addNerve(a,true,false);paths.push(CR([...sp0,...spL,...a]))});
paths.push(spineC);
// impulsos
const PU=[],tc=[0xffd24a,0xff3d9a];
paths.forEach(c=>{const len=c.getLength(),n=Math.max(2,Math.round(len/45*K));for(let i=0;i<n;i++)PU.push({c,len,t:Math.random(),dir:i%2?-1:1,v:rnd(70,120),col:i%2?1:0})});
for(let i=0;i<Math.round(64*K);i++){const k=Math.random()*BC.length|0,a=BC[k]||0,b=BC[k]?BC[k+(k%2?-1:1)]||0:0;const A=V(bP[a],bP[a+1],bP[a+2]),B=V(bP[b],bP[b+1],bP[b+2]),c=new THREE.LineCurve3(A,B);PU.push({c,len:Math.max(4,A.distanceTo(B)),t:Math.random(),dir:Math.random()<.5?1:-1,v:rnd(25,45),col:Math.random()<.5?0:1})}
const pg=new THREE.BufferGeometry(),pa=new Float32Array(PU.length*3),pc=new Float32Array(PU.length*3);
PU.forEach((p,i)=>{const c=new THREE.Color(tc[p.col]).multiplyScalar(1.3);pc.set([c.r,c.g,c.b],i*3)});
pg.setAttribute('position',new THREE.BufferAttribute(pa,3));pg.setAttribute('color',new THREE.BufferAttribute(pc,3));
const pulses=new THREE.Points(pg,new THREE.PointsMaterial({size:7,map:glT,vertexColors:true,transparent:true,depthWrite:false,blending:ADD}));pulses.frustumCulled=false;body.add(pulses);
$('hud').textContent=PU.length;
const grid=new THREE.GridHelper(1400,44,0x5a2230,0x2a1018);grid.position.y=-360;grid.material.transparent=true;grid.material.opacity=.35;scene.add(grid);

/* ---------- neurona ---------- */
const NG=new THREE.Group();NG.position.set(380,-40,0);scene.add(NG);
function br(f,d0,len,seg,wob){const p=[f.clone()];let q=f.clone(),d=d0.clone();for(let i=0;i<seg;i++){d.add(V(rnd(-wob,wob),rnd(-wob,wob),rnd(-wob,wob))).normalize();q=q.clone().addScaledVector(d,len/seg);p.push(q)}return new THREE.CatmullRomCurve3(p)}
const soma=new THREE.Mesh(new THREE.SphereGeometry(7,26,20),new THREE.MeshBasicMaterial({color:0xff6a3d,transparent:true,opacity:.5,blending:ADD,depthWrite:false}));NG.add(soma);
NG.add(new THREE.Mesh(new THREE.SphereGeometry(3,16,12),new THREE.MeshBasicMaterial({color:0xffe2b8,transparent:true,opacity:.9})));
const sg=glowSp(0xff6a3d,48,.55);NG.add(sg);
for(let k=0;k<9;k++){const d=V(-rnd(.3,1),rnd(-1,1),rnd(-1,1)).normalize(),c=br(d.clone().multiplyScalar(6.5),d,rnd(26,40),4,.5);NG.add(tube(c,.55,0xff9a3d,.8,30));
 for(let m=0;m<2;m++){const t=rnd(.4,.75),s=c.getPoint(t),dd=c.getTangent(t).clone().add(V(rnd(-.8,.8),rnd(-.8,.8),rnd(-.8,.8))).normalize();NG.add(tube(br(s,dd,rnd(10,18),3,.5),.32,0xffc46b,.75,16))}}
const axon=CR([[7,0,0],[40,6,4],[80,-8,-4],[120,5,3],[150,0,0]]);NG.add(tube(axon,.9,0xffd24a,.85,70));
for(let i=0;i<7;i++){const t=.13+i*.115,p=axon.getPoint(t),tg=axon.getTangent(t),m=new THREE.Mesh(new THREE.SphereGeometry(1,16,12),new THREE.MeshBasicMaterial({color:0xfff1dd,transparent:true,opacity:.72}));m.position.copy(p);m.scale.set(4.4,1.9,1.9);m.quaternion.setFromUnitVectors(V(1,0,0),tg);NG.add(m)}
const E=axon.getPoint(1),TB=[];
for(let i=0;i<5;i++){const d=V(1,rnd(-.7,.7),rnd(-.7,.7)).normalize(),c=br(E,d,14,2,.3),e=c.getPoint(1);NG.add(tube(c,.5,0xff7aa8,.8,12));const b=new THREE.Mesh(new THREE.SphereGeometry(1.8,12,10),new THREE.MeshBasicMaterial({color:0xff3d9a}));b.position.copy(e);NG.add(b);const g=glowSp(0xff3d9a,10,.8);g.position.copy(e);NG.add(g);TB.push(e)}
{const P=[],C=[],c=new THREE.Color(0x2de2c4);for(let i=0;i<40;i++){const y=rnd(-16,16),z=rnd(-16,16);P.push(E.x+19-(y*y+z*z)/30,y,z);C.push(c.r,c.g,c.b)}NG.add(pts(P,C,3.4,.95))}
const AP=glowSp(0xffffff,15,1);NG.add(AP);
const NT=[],ntg=new THREE.BufferGeometry(),ntp=new Float32Array(70*3),ntc=new Float32Array(70*3);for(let i=0;i<70;i++)NT.push({b:TB[i%5],d:V(rnd(.6,1.4),rnd(-.5,.5),rnd(-.5,.5)),ph:Math.random()});
ntg.setAttribute('position',new THREE.BufferAttribute(ntp,3));ntg.setAttribute('color',new THREE.BufferAttribute(ntc,3));
const nt=new THREE.Points(ntg,new THREE.PointsMaterial({size:3,map:glT,vertexColors:true,transparent:true,depthWrite:false,blending:ADD}));nt.frustumCulled=false;NG.add(nt);
[[V(0,0,0),22,'neuron',0,0],[TB[2],13,'synapse',0,0]].forEach(([p,r,id])=>{const m=new THREE.Mesh(new THREE.SphereGeometry(r,10,8),new THREE.MeshBasicMaterial({visible:false}));m.position.copy(p);m.userData.id=id;NG.add(m);pickers.push(m)});

/* ---------- selección con zonas invisibles ---------- */
[[0,3,0,32,'brain',1,.8,1.1],[0,-15,-19,13,'cerebellum',1,.7,.8],[0,-23,-8,7,'stem',1,2.4,1],[0,-105,-10,6,'spine',1,13,1]].forEach(([x,y,z,r,id,sx,sy,sz])=>{const m=new THREE.Mesh(new THREE.SphereGeometry(r,10,8),new THREE.MeshBasicMaterial({visible:false}));m.position.set(x,y,z);m.scale.set(sx,sy,sz);m.userData.id=id;body.add(m);pickers.push(m)});
const halo=glowSp(0xffffff,60,0);scene.add(halo);

/* ---------- UI ---------- */
const chips=$('chips'),lbls={};
Object.entries(PT).forEach(([id,p],i)=>{
 const b=document.createElement('button');b.className='chip';b.dataset.id=id;b.innerHTML=`<em>0${i+1}</em><span class="dot" style="background:${p.col};color:${p.col}"></span>${p.n}`;b.onclick=()=>select(id);chips.appendChild(b);
 const l=document.createElement('div');l.className='lbl';l.textContent=p.n;l.onclick=()=>select(id);$('labels').appendChild(l);lbls[id]=l});
let az=.5,el=.12,dist=560,distT=560,sel=null;const focus=new THREE.Vector3(0,-150,0),fT=new THREE.Vector3(0,-150,0);
function select(id){sel=id;const p=PT[id];fT.set(...p.pos);distT=p.dist;if(id==='neuron'||id==='synapse'){az=0;el=.15}
 $('pn').textContent=p.n;$('pc').textContent=p.c;$('pd').textContent=p.d;$('pg').innerHTML=p.s.map(s=>`<div class="st"><i>${s[0]}</i><b>${s[1]}</b></div>`).join('');$('panel').classList.add('open');
 halo.material.color.set(p.col);halo.position.set(...p.pos);halo.scale.set(p.hs,p.hs,1);
 document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.id===id));Object.entries(lbls).forEach(([k,l])=>l.classList.toggle('on',k===id))}
function reset(){sel=null;fT.set(0,-150,0);distT=560;el=.12;$('panel').classList.remove('open');document.querySelectorAll('.chip,.lbl').forEach(c=>c.classList.remove('on'))}
$('x').onclick=reset;$('br').onclick=reset;
const ptr=new Map(),ray=new THREE.Raycaster(),m2=new THREE.Vector2();let moved=0;
function hit(e){m2.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(m2,cam);const h=ray.intersectObjects(pickers,false);return h.length?h[0].object.userData.id:null}
const cvs=R.domElement;
cvs.addEventListener('pointerdown',e=>{ptr.set(e.pointerId,e);moved=0;cvs.setPointerCapture(e.pointerId)});
cvs.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId)){cvs.style.cursor=hit(e)?'pointer':'grab';return}const o=ptr.get(e.pointerId);
 if(ptr.size===2){const[a,b]=[...ptr.values()],d0=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);ptr.set(e.pointerId,e);const[c,d]=[...ptr.values()],d1=Math.hypot(c.clientX-d.clientX,c.clientY-d.clientY);distT=Math.max(25,Math.min(1100,distT*d0/d1));moved=99;return}
 az-=(e.clientX-o.clientX)*.005;el=Math.max(-1.2,Math.min(1.4,el+(e.clientY-o.clientY)*.005));moved+=Math.abs(e.clientX-o.clientX)+Math.abs(e.clientY-o.clientY);ptr.set(e.pointerId,e)});
const up=e=>{if(ptr.has(e.pointerId)&&ptr.size===1&&moved<6){const id=hit(e);id&&select(id)}ptr.delete(e.pointerId)};
cvs.addEventListener('pointerup',up);cvs.addEventListener('pointercancel',e=>ptr.delete(e.pointerId));
addEventListener('wheel',e=>{distT=Math.max(25,Math.min(1100,distT*(1+e.deltaY*.0012)))},{passive:true});
let paused=false,speed=1;
$('bp').onclick=function(){paused=!paused;this.innerHTML=paused?'▶ <span>REANUDAR</span>':'⏸ <span>PAUSAR</span>';this.classList.toggle('on',paused)};
$('sr').oninput=e=>{speed=+e.target.value;$('sv').textContent=speed.toFixed(1)+'x'};
$('bc').onclick=function(){conn.visible=!conn.visible;this.classList.toggle('on',conn.visible)};
$('bl').onclick=function(){const h=document.body.classList.toggle('hide-l');this.classList.toggle('on',!h)};
addEventListener('enter',()=>{dist=1500});

/* ---------- animación ---------- */
const clock=new THREE.Clock(),tmp=V(0,0,0),v3=V(0,0,0);let T=0,apT=0;
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.1);
 if(!paused){T+=dt*speed;
  for(let i=0;i<PU.length;i++){const p=PU[i];p.t+=p.dir*p.v*dt*speed/p.len;if(p.t>1)p.t-=1;if(p.t<0)p.t+=1;p.c.getPointAt(p.t,tmp);pa[i*3]=tmp.x;pa[i*3+1]=tmp.y;pa[i*3+2]=tmp.z}
  pg.attributes.position.needsUpdate=true;
  apT=(apT+dt*speed*.22)%1.35;const u=Math.min(1,apT);axon.getPointAt(u,tmp);AP.position.copy(tmp);AP.material.opacity=apT<1?1:0;sg.material.opacity=.45+.35*Math.max(0,1-apT*5);
  for(let i=0;i<70;i++){const n=NT[i],q=((T*.5+n.ph)%1);ntp[i*3]=n.b.x+n.d.x*q*14;ntp[i*3+1]=n.b.y+n.d.y*q*14;ntp[i*3+2]=n.b.z+n.d.z*q*14;const f=(1-q)*(apT>.95||apT<.25?1:.35);ntc[i*3]=1*f;ntc[i*3+1]=.8*f;ntc[i*3+2]=.35*f}
  nt.geometry.attributes.position.needsUpdate=true;nt.geometry.attributes.color.needsUpdate=true}
 brain.scale.setScalar(1+.008*Math.sin(performance.now()/420));
 halo.material.opacity=(sel&&PT[sel].hs)?(.3+.15*Math.sin(performance.now()/300)):0;
 if(!sel&&!ptr.size)az+=.0005;
 focus.lerp(fT,.07);dist+=(distT-dist)*.055;
 cam.position.set(focus.x+dist*Math.cos(el)*Math.sin(az),focus.y+dist*Math.sin(el),focus.z+dist*Math.cos(el)*Math.cos(az));cam.lookAt(focus);
 const W=innerWidth,H=innerHeight;
 for(const id in lbls){const p=PT[id].pos;v3.set(p[0],p[1]+(id==='brain'?30:id==='spine'?0:12),p[2]);if(id==='spine'||id==='nerves')v3.x+=id==='spine'?14:0;v3.project(cam);const l=lbls[id];if(v3.z>1||Math.abs(v3.x)>1.1||Math.abs(v3.y)>1.1){l.style.display='none';continue}l.style.display='';l.style.transform=`translate(${(v3.x*.5+.5)*W}px,${(-v3.y*.5+.5)*H}px) translate(-50%,-100%)`}
 R.render(scene,cam)}
loop();
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
